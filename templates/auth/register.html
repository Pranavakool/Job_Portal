{% extends "base.html" %}

{% block title %}Create Account | JobPortal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-9">
      
      <!-- Registration Card -->
      <div class="form-card shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h3 class="fw-bold mb-1">Create Your Account</h3>
          <p class="text-muted small">Join thousands of job seekers and top employers today</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <!-- Role Selection (Job Seeker vs Employer ONLY - Admin forbidden) -->
          <div class="mb-4">
            <label class="form-label d-block text-center mb-2">I want to:</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="role_seeker" value="seeker" {% if role != 'employer' %}checked{% endif %}>
                <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="role_seeker">
                  <i class="bi bi-person-badge fs-4 mb-1"></i>
                  <span class="fw-bold">Job Seeker</span>
                  <small class="text-muted" style="font-size: 0.75rem;">Find great jobs</small>
                </label>
              </div>
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="role_employer" value="employer" {% if role == 'employer' %}checked{% endif %}>
                <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="role_employer">
                  <i class="bi bi-building fs-4 mb-1"></i>
                  <span class="fw-bold">Employer</span>
                  <small class="text-muted" style="font-size: 0.75rem;">Hire top talent</small>
                </label>
              </div>
            </div>
          </div>

          <!-- Full Name / Company Name -->
          <div class="mb-3">
            <label class="form-label" for="name" id="nameLabel">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Rahul Sharma" required>
            </div>
          </div>

          <!-- Email Address -->
          <div class="mb-3">
            <label class="form-label" for="email">Work / Personal Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@domain.com" required>
            </div>
          </div>

          <!-- Password Field -->
          <div class="mb-3">
            <label class="form-label" for="password">Password (Minimum 6 characters)</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" minlength="6" required>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="mb-4">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
              <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="••••••••" minlength="6" required>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3">
            <i class="bi bi-check-circle-fill me-1"></i> Complete Registration
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
          <p class="text-muted small mb-0">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary text-decoration-none">Sign In here</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Dynamic label adjust
  const roleSeeker = document.getElementById('role_seeker');
  const roleEmployer = document.getElementById('role_employer');
  const nameLabel = document.getElementById('nameLabel');
  const nameInput = document.getElementById('name');

  function updateLabel() {
    if (roleEmployer.checked) {
      nameLabel.textContent = "Company / Organization Name";
      nameInput.placeholder = "e.g. TechCorp Solutions";
    } else {
      nameLabel.textContent = "Full Name";
      nameInput.placeholder = "e.g. Rahul Sharma";
    }
  }

  roleSeeker.addEventListener('change', updateLabel);
  roleEmployer.addEventListener('change', updateLabel);
  updateLabel();
</script>
{% endblock %}
