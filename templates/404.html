{% extends "base.html" %}

{% block title %}404 - Page Not Found | JobPortal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center py-5">
    <div class="col-lg-6 col-md-8">
      <div class="mb-4">
        <span class="display-1 fw-bold text-primary">404</span>
      </div>
      <h2 class="fw-bold mb-3">Oops! Page Not Found</h2>
      <p class="text-muted mb-4 lead">
        The job posting, candidate profile, or page you are looking for might have been moved, expired, or does not exist.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('jobs.index') }}" class="btn btn-primary px-4 py-2">
          <i class="bi bi-house-door-fill me-1"></i> Return Home
        </a>
        <a href="{{ url_for('jobs.list_jobs') }}" class="btn btn-outline-secondary px-4 py-2">
          <i class="bi bi-search me-1"></i> Browse Open Jobs
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
