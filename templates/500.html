{% extends "base.html" %}

{% block title %}500 - Server Error | JobPortal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center py-5">
    <div class="col-lg-6 col-md-8">
      <div class="mb-4 text-danger">
        <i class="bi bi-exclamation-octagon-fill display-1"></i>
      </div>
      <h2 class="fw-bold mb-3">500 - Server Error</h2>
      <p class="text-muted mb-4 lead">
        {{ error_message or "An unexpected error occurred while processing your request. Our technical team has been notified." }}
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('jobs.index') }}" class="btn btn-primary px-4 py-2">
          <i class="bi bi-house-door-fill me-1"></i> Return Home
        </a>
        <a href="{{ url_for('jobs.list_jobs') }}" class="btn btn-outline-secondary px-4 py-2">
          <i class="bi bi-search me-1"></i> Browse Jobs
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
